<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDP Automation Dummy Test Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-md p-8 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl">
    <h2 class="text-xl font-bold text-white mb-2">Automation Test Form</h2>
    <p class="text-xs text-slate-400 mb-6">This form acts as a dummy endpoint to test Playwright CDP form-filling.</p>
    
    <form id="test-form" onsubmit="handleSubmit(event)" class="space-y-4">
      <div>
        <label for="applicant_name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Applicant Name</label>
        <input 
          type="text" 
          id="applicant_name" 
          placeholder="First Name will go here" 
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-850 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition"
        >
      </div>

      <div>
        <label for="district_dropdown" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">District / City</label>
        <input 
          type="text" 
          id="district_dropdown" 
          placeholder="City will go here" 
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-850 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition"
        >
      </div>

      <div>
        <label for="action_type" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Action Type</label>
        <input 
          type="text" 
          id="action_type" 
          placeholder="Action type will go here" 
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-850 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition"
        >
      </div>

      <div class="pt-4">
        <button 
          id="submit_btn" 
          type="submit" 
          class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white tracking-wide transition shadow-lg shadow-indigo-600/20 active:scale-95"
        >
          Submit Application
        </button>
      </div>
    </form>

    <!-- Success Result Display -->
    <div id="result-card" class="hidden mt-6 p-4 rounded-2xl bg-emerald-950/40 border border-emerald-900/40 text-emerald-300 text-xs space-y-2 animate-pulse">
      <div class="flex items-center gap-1.5 font-bold text-white">
        <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Submission Received!</span>
      </div>
      <p id="result-details" class="font-mono whitespace-pre-wrap"></p>
    </div>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      
      const name = document.getElementById('applicant_name').value;
      const district = document.getElementById('district_dropdown').value;
      const action = document.getElementById('action_type').value;
      
      const resultCard = document.getElementById('result-card');
      const resultDetails = document.getElementById('result-details');
      
      resultDetails.textContent = JSON.stringify({
        applicant_name: name,
        district_dropdown: district,
        action_type: action,
        timestamp: new Date().toLocaleTimeString()
      }, null, 2);
      
      resultCard.classList.remove('hidden');
    }
  </script>
</body>
</html>
