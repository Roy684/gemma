<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dummy Portal — Voter ID Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-md p-8 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl">
    <h2 class="text-xl font-bold text-white mb-1">Voter ID Application (Form 6)</h2>
    <p class="text-xs text-slate-400 mb-6">Dummy stand-in for an Election Commission portal.</p>

    <form id="voter-id-form" onsubmit="handleSubmit(event)" class="space-y-4">

      <div>
        <label for="full_name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Full Name</label>
        <input type="text" id="full_name" name="full_name" required placeholder="As per proof of identity"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label for="dob" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Date of Birth</label>
        <input type="text" id="dob" name="dob" required placeholder="DD/MM/YYYY"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label for="gender" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Gender</label>
        <select id="gender" name="gender" required
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-indigo-500 transition">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label for="relative_name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Father's / Mother's / Husband's Name</label>
        <input type="text" id="relative_name" name="relative_name" required placeholder="Full name"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label for="constituency" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Assembly Constituency</label>
        <input type="text" id="constituency" name="constituency" required placeholder="Enter constituency name"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label for="address" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Residential Address</label>
        <textarea id="address" name="address" required rows="2" placeholder="House no., street, locality"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition"></textarea>
      </div>

      <div>
        <label for="mobile_number" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Mobile Number</label>
        <input type="tel" id="mobile_number" name="mobile_number" required placeholder="10-digit mobile number"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div class="pt-4">
        <button id="submit_btn" type="submit"
          class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white tracking-wide transition shadow-lg shadow-indigo-600/20 active:scale-95">
          Submit Application
        </button>
      </div>
    </form>

    <div id="result-card" class="hidden mt-6 p-4 rounded-2xl bg-emerald-950/40 border border-emerald-900/40 text-emerald-300 text-xs space-y-2">
      <div class="flex items-center gap-1.5 font-bold text-white">
        <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Application Received!</span>
      </div>
      <p id="result-details" class="font-mono whitespace-pre-wrap"></p>
    </div>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const form = document.getElementById('voter-id-form');
      const data = Object.fromEntries(new FormData(form).entries());
      document.getElementById('result-details').textContent = JSON.stringify(data, null, 2);
      document.getElementById('result-card').classList.remove('hidden');
    }
  </script>
</body>
</html>
