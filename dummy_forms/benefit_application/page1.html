<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benefit Application - Step 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 p-6 text-slate-800">
  <div class="mx-auto max-w-2xl rounded-3xl bg-white p-8 shadow-sm">
    <h1 class="mb-2 text-2xl font-semibold">Benefit Application</h1>
    <p class="mb-6 text-sm text-slate-500">Step 1 of 3</p>

    <form id="benefit-form" onsubmit="event.preventDefault(); window.location.href='page2.html'">
      <div class="space-y-4">
        <div>
          <label for="applicant_name" class="mb-1 block text-sm font-medium">Applicant Name</label>
          <input id="applicant_name" name="applicant_name" required class="w-full rounded-xl border border-slate-300 px-4 py-2" />
        </div>
        <div>
          <label for="dob" class="mb-1 block text-sm font-medium">Date of Birth</label>
          <input id="dob" name="dob" required class="w-full rounded-xl border border-slate-300 px-4 py-2" />
        </div>
        <div>
          <label for="gender" class="mb-1 block text-sm font-medium">Gender</label>
          <select id="gender" name="gender" required class="w-full rounded-xl border border-slate-300 px-4 py-2">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="mt-6 flex justify-end">
        <button id="next_btn" type="submit" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white">Next</button>
      </div>
    </form>
  </div>
</body>
</html>
